<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzan tilaus käyttöliittymä</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/tentti.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Tilaa Pizza</h1>
        <div class="row">
            <div class="col-md-4">
                <img src="pictures/pizza.png" class="img-fluid rounded">
                <br>
                <span class="info-icon" data-bs-toggle="tooltip" title="Lisätietoja pizzasta.">
                    Pizza<i class="bi bi-info-circle-fill"></i>
                </span>
            </div>
            <div class="col-md-8">
                <div class="mb-3">
                    <label for="size" class="form-label">Valitse koko:</label>
                    <select id="size" class="form-select" onchange="updatePrice()">
                        <option value="0">Valitse</option>
                        <option value="6">Tavallinen (6€)</option>
                        <option value="12">Perhepizza (12€)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Valitse täytteet:</label>
                    <div class="form-check">
                        <input type="checkbox" id="ananas" value="2" class="form-check-input" onchange="updatePrice()">
                        <label for="ananas" class="form-check-label">Ananas (2€)</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="kinkku" value="2" class="form-check-input" onchange="updatePrice()">
                        <label for="kinkku" class="form-check-label">Kinkku (2€)</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="pepperoni" value="2" class="form-check-input"
                            onchange="updatePrice()">
                        <label for="pepperoni" class="form-check-label">Pepperoni (2€)</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="aurajuusto" value="2" class="form-check-input"
                            onchange="updatePrice()">
                        <label for="aurajuusto" class="form-check-label">Aurajuusto (2€)</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="tonnikala" value="2" class="form-check-input"
                            onchange="updatePrice()">
                        <label for="tonnikala" class="form-check-label">Tonnikala (2€)</label>
                    </div>
                </div>
                <p>Hinta yhteensä: <span id="totalPrice">0</span>€</p>

            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button class="btn btn-primary me-md-2" onclick="resetOrder()">Tilaa</button>
            </div>
        </div>
    </div>
    <script src="scripts/tentti.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script> document.addEventListener('DOMContentLoaded', function () {
            const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
            const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
        }); 
    </script>
</body>

</html>
